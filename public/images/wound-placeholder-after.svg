<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAfter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#bgAfter)" rx="16"/>

  <!-- Medical Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="75" x2="600" y2="75"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="225" x2="600" y2="225"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="375" x2="600" y2="375"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
  </g>

  <!-- Glow effect -->
  <circle cx="300" cy="210" r="140" fill="url(#glowGreen)"/>

  <!-- Badge Top -->
  <rect x="185" y="32" width="230" height="34" rx="17" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5"/>
  <text x="300" y="54" font-family="'Cairo', sans-serif" font-size="14" font-weight="bold" fill="#6ee7b7" text-anchor="middle">
    بعد الغيار والتطهير والضماد المعقم ✨
  </text>

  <!-- Center Shield Check Icon -->
  <circle cx="300" cy="200" r="60" fill="#047857" stroke="#10b981" stroke-width="2"/>
  <path d="M300 160 L335 175 L335 210 C335 235 300 250 300 250 C300 250 265 235 265 210 L265 175 Z" fill="none" stroke="#ffffff" stroke-width="3"/>
  <path d="M285 203 L295 213 L318 190" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Text Info -->
  <text x="300" y="295" font-family="'Cairo', sans-serif" font-size="16" font-weight="bold" fill="#ecfdf5" text-anchor="middle">
    تعقيم جراحي وحماية متكاملة للأنسجة 🛡️
  </text>
  <text x="300" y="325" font-family="'Cairo', sans-serif" font-size="12" fill="#a7f3d0" text-anchor="middle">
    تقنية لاتلامسية معقمة (Aseptic Non-Touch Technique)
  </text>

  <!-- Bottom Brand -->
  <rect x="180" y="375" width="240" height="32" rx="8" fill="#064e3b" stroke="#047857"/>
  <text x="300" y="396" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" fill="#34d399" text-anchor="middle">
    نبض للتمريض المنزلي — دمياط
  </text>
</svg>
